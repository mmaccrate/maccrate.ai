[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maccrate-qad"
version = "0.1.0"
description = "Reproducible quantization-aware distillation for Gemma 4 E2B"
requires-python = ">=3.11"
dependencies = [
  "accelerate==1.14.0",
  "numpy==2.5.2",
  "pyarrow==25.0.1",
  "safetensors==0.8.0",
  "torch==2.9.1",
  "transformers==5.16.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
