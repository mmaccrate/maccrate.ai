name: Notify MacCrate deployment runner

on:
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch branch deployment
        env:
          GH_TOKEN: ${{ secrets.MACCRATE_OPS_DISPATCH_TOKEN }}
          TARGET_REPOSITORY: mmaccrate/maccrate.ai-ops
        run: |
          gh api --method POST "repos/${TARGET_REPOSITORY}/dispatches" \
            -f event_type=app-updated \
            -F "client_payload[branch]=${GITHUB_REF_NAME}" \
            -F "client_payload[sha]=${GITHUB_SHA}"
